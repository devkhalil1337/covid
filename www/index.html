<!DOCTYPE html>
<html>

<head>
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport"
        content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
    <title>Stats Viewer</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loader.css">
</head>

<body ng-app="myApp" ng-controller="myCtrl">
    <div class="container mt-4">
        <div class="card shadow p-3">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                <h4 class="mb-2">
                    <img src="img/k2.png" width="17px" alt="">
                    Stats Viewer
                    <i class="fa fa-refresh text-primary ml-2" style="cursor: pointer;" aria-hidden="true"
                        title="Refresh" ng-click="getData();"></i>
                </h4>
            </div>

            <div class="row">
                <div class="col-md-6 mb-2">
                    <label class="mr-2">Country:</label>
                    <select class="form-control" ng-model="selectedCountry"
                        ng-options="c.name for c in countries track by c.code" ng-change="getData()">
                    </select>
                </div>
                <div class="col-md-6 mb-2">
                    <label class="mr-2">Year:</label>
                    <select class="form-control" ng-model="selectedYear" ng-options="year for year in availableYears"
                        ng-change="getData()">
                    </select>
                </div>
            </div>

            <div ng-if="dataLoaded">
                <h5 class="mt-4 mb-2 text-center">📊 Key Stats</h5>
                <div class="row">
                    <div class="col-md-4 col-6 mb-3" ng-repeat="s in mainStats">
                        <div class="card p-2 h-100">
                            <div class="small text-muted">{{s.label}}</div>
                            <div class="font-weight-bold">
                                {{s.valueStr}}<span class="text-muted small">{{s.yearTag}}</span>
                            </div>
                            <div class="small" ng-if="s.changeStr"
                                ng-class="s.dir === 'up' ? 'text-success' : 'text-danger'">
                                <span ng-if="s.dir === 'up'">▲</span><span ng-if="s.dir === 'down'">▼</span>
                                {{s.changeStr}} <span class="text-muted">YoY</span>
                            </div>
                        </div>
                    </div>
                </div>

                <h5 class="mt-3 mb-2 text-center">🏛 Budget (% of GDP)</h5>
                <div class="row">
                    <div class="col-md-4 col-6 mb-3" ng-repeat="s in budgetStats">
                        <div class="card p-2 h-100">
                            <div class="small text-muted">{{s.label}}</div>
                            <div class="font-weight-bold">
                                {{s.valueStr}}<span class="text-muted small">{{s.yearTag}}</span>
                            </div>
                            <div class="small" ng-if="s.changeStr"
                                ng-class="s.dir === 'up' ? 'text-success' : 'text-danger'">
                                <span ng-if="s.dir === 'up'">▲</span><span ng-if="s.dir === 'down'">▼</span>
                                {{s.changeStr}} <span class="text-muted">YoY</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-2">
                        <div class="card p-2"><strong>🌦 Rainfall (year total):</strong> {{rainfall}}</div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="card p-2"><strong>⏱ Last Refreshed:</strong> {{lastUpdated}}</div>
                    </div>
                </div>
            </div>

            <div class="text-center my-4" ng-if="!dataLoaded">
                <div class="spinner-border text-primary mb-2" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p>Loading data, please wait...</p>
            </div>

            <div class="mt-4">
                <canvas id="gdpChart" height="120"></canvas>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <script type="text/javascript" src="js/angular.min.js"></script>
    <script type="text/javascript" src="js/controller.js"></script>

    <style>
        li.list-group-item {
            background-color: unset !important;
        }
    </style>
</body>

</html>
